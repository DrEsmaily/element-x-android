name: Upload Benchmark Nightly SDK

on:
  workflow_dispatch:
  push:
    branches:
      - upload-benchmark-nightly-sdk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
      CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Make benchmark build installable beside Element X
        shell: bash
        run: |
          test "$(grep -c 'getByName("release") {' app/build.gradle.kts)" -eq 1
          sed -i '/getByName("release") {/a\            applicationIdSuffix = ".uploadbenchnightly"' app/build.gradle.kts
          git diff --check

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build Gplay release
        run: ./gradlew :app:assembleGplayRelease -x lintVitalGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upload-benchmark-nightly-sdk-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/gplay/release/*-universal-release.apk
