name: SyncMe Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - syncme-164-tags-pages
      - syncme-178-from-176
      - syncme-199-presence-clean-180
      - syncme-204-presence-centralized
    paths:
      - '.github/syncme-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: syncme-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build-release:
    name: Build SyncMe optimized release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout SyncMe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Make release installable beside other Element X builds
        shell: bash
        run: |
          test "$(grep -c 'getByName("release") {' app/build.gradle.kts)" -eq 1
          sed -i '/getByName("release") {/a\            applicationIdSuffix = ".syncmerelease"' app/build.gradle.kts
          git diff --check
          grep -F 'applicationIdSuffix = ".syncmerelease"' app/build.gradle.kts

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build optimized SyncMe release APK
        env:
          SYNCME_BUILD_NUMBER: ${{ github.run_number }}
        # Compress native .so files and let Android extract them on install; preserve all app features.
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=true -x lintVitalGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Test clean Matrix Presence rules
        run: ./gradlew :libraries:matrix:api:testDebugUnitTest --tests '*UserPresenceTest' $CI_GRADLE_ARG_PROPERTIES

      - name: Verify Presence cannot alter Matrix startup
        shell: bash
        run: |
          set -euo pipefail
          file=libraries/matrix/impl/src/main/kotlin/io/element/android/libraries/matrix/impl/RustMatrixClient.kt
          ! grep -Eq 'processPresenceObserver|setPresence\(|sessionIdFlow' "$file"
          grep -F 'override suspend fun getPresence' "$file"

      - name: Inspect exact Rust SDK Presence API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Installed SDK Android AARs ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.matrix.rustcomponents/sdk-android" -name '*.aar' -print 2>/dev/null || true
          echo "=== Presence classes and method signatures ==="
          aar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.matrix.rustcomponents/sdk-android" -name '*.aar' -print -quit 2>/dev/null || true)
          if [ -n "$aar" ]; then
            mkdir -p /tmp/syncme-rust-aar
            unzip -p "$aar" classes.jar > /tmp/syncme-rust-aar/classes.jar
            jar tf /tmp/syncme-rust-aar/classes.jar | grep -Ei 'presence|sync.*listener' | head -60 || true
            javap -classpath /tmp/syncme-rust-aar/classes.jar org.matrix.rustcomponents.sdk.Client 2>/dev/null | grep -Ei 'presence|observe|sync' | head -90 || true
          fi

      - name: Generate full per-build continuation TXT
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p build-checkpoint
          FILE="build-checkpoint/SyncMe-CHECKPOINT-${RUN_NO}-${SHA:0:9}.txt"
          {
            echo "SYNCME BUILD CONTINUATION CHECKPOINT"
            echo "UTC timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo "Build number: ${RUN_NO}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${SHA}"
            echo "Build job state: ${JOB_RESULT}"
            echo "Build: :app:assembleGplayRelease, optimized Release, applicationIdSuffix=.syncmerelease"
            echo "ARM64 APK created: $(if compgen -G 'app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk' >/dev/null; then echo yes; else echo no; fi)"
            echo "Universal APK created: $(if test -f app/build/outputs/apk/gplay/release/app-gplay-universal-release.apk; then echo yes; else echo no; fi)"
            echo "Note: APK compilation does not validate runtime upload, room speed or UI."
            echo
            echo "=== MASTER REQUIREMENTS / CURRENT KNOWN STATUS ==="
            cat .github/SYNCME_CONTINUATION_MASTER.txt
            echo
            echo "=== COMPLETE COMMIT HISTORY (OLDEST FIRST) ==="
            git log --reverse --date=iso-strict --format='%H | %ad | %s' HEAD
            echo
            echo "=== CHANGED FILES SINCE LAST CONFIRMED SUCCESSFUL BUILD #77 ==="
            git diff --name-status 79cc969595a26bbf4e8aa1919213a4d83512b293..HEAD || true
            echo
            echo "=== CONTINUE IN NEXT CHAT ==="
            echo "Inspect this run's outcome and exact code state before claiming fixes."
            echo "Priority: diagnose upload retry/stall/duplicate events; then room-opening responsiveness; then progress/bubbles/bottom-sheets/tag/black-theme regression testing."
          } > "$FILE"

      - name: Upload ARM64 APK and checkpoint
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-ARM64-optimized-release-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
            build-checkpoint/*.txt

      - name: Preserve checkpoint for failed builds
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-failed-build-checkpoint-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: warn
          path: build-checkpoint/*.txt
