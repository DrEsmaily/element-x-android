name: Element X Upstream Release Baseline APK

on:
  workflow_dispatch:
  push:
    branches:
      - upstream-baseline-build

permissions:
  contents: read

concurrency:
  group: upstream-baseline-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build-upstream:
    name: Build pristine Element X upstream release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout pristine upstream Element X
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: element-hq/element-x-android
          ref: 48fc09a7c390454a529904418c7a07e327b356f9
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pristine source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "48fc09a7c390454a529904418c7a07e327b356f9"
          test -z "$(git status --porcelain)"
          echo "Building pristine upstream SHA: $(git rev-parse HEAD)"

      - name: Make baseline installable beside Google Play
        shell: bash
        run: |
          test "$(grep -c 'getByName("release") {' app/build.gradle.kts)" -eq 1
          sed -i '/getByName("release") {/a\            applicationIdSuffix = ".baseline"' app/build.gradle.kts
          git diff --check
          grep -F 'applicationIdSuffix = ".baseline"' app/build.gradle.kts

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build pristine upstream universal release APK
        run: ./gradlew :app:assembleGplayRelease -x lintVitalGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload pristine upstream release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ElementX-Upstream-Release-SideBySide-48fc09a7c390454a529904418c7a07e327b356f9
          if-no-files-found: error
          path: app/build/outputs/apk/gplay/release/*-universal-release.apk
