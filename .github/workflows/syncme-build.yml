name: SyncMe Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - syncme-main

permissions:
  contents: read

concurrency:
  # Never let a delayed older push cancel the build for a newer commit.
  # Each commit gets its own build group so the APK always matches its SHA.
  group: syncme-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build-syncme:
    name: Build SyncMe optimized universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build optimized SyncMe APK
        run: ./gradlew :app:assembleGplaySyncme -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      - name: Upload SyncMe APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SyncMe-optimized-apk-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/gplay/syncme/*-universal-syncme.apk
