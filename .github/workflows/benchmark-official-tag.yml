name: Benchmark Element X v26.09.4 clean release
on:
  workflow_dispatch:
  push:
    branches:
      - benchmark-elementx-v26-09-4
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unchanged official release source
        run: ./gradlew :app:assembleGplayRelease -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: elementx-v26-09-4-official-source
          path: app/build/outputs/apk/gplay/release/*-universal-release.apk
          if-no-files-found: error
