name: SyncMe 234 ARM64 parity no optimization
on:
  push:
    branches:
      - syncme-234-arm64-pristine-parity-20261010
    paths:
      - '.github/workflows/syncme-234-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disable R8 in build runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          old="optimization {\n                enable = true"
          assert s.count(old)==1,"Unexpected release optimization config"
          p.write_text(s.replace(old,"optimization {\n                enable = false"))
          PY
      - name: Build ARM64 with same flags as pristine baseline
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=false -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - name: Verify native libraries uncompressed
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,glob,os
          files=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert files,"ARM64 APK missing"
          for f in files:
              with zipfile.ZipFile(f) as z:
                  libs=[i for i in z.infolist() if i.filename.endswith(".so")]
                  assert libs,"Native libraries missing"
                  zipped=[i.filename for i in libs if i.compress_type!=zipfile.ZIP_STORED]
                  print("APK:",f,"Bytes:",os.path.getsize(f),"Native:",len(libs),"Compressed native:",len(zipped))
                  assert not zipped,"Native libraries compressed"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SyncMe-234-ARM64-no-opt
          path: app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
          if-no-files-found: error
