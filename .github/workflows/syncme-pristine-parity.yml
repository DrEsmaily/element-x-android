name: SyncMe ARM64 parity with pristine Element X
on:
  push:
    branches:
      - syncme-test-224-uncompressed-20261010
    paths:
      - '.github/workflows/syncme-pristine-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check unoptimized release matches pristine baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/build.gradle.kts").read_text()
          assert "optimization {" in s
          assert "enable = false" in s.split("optimization {",1)[1].split("}",1)[0], "R8 release optimization must be disabled"
          assert 'useLegacyPackaging = project.findProperty("useLegacyPackaging")?.toString()?.toBoolean()' in s
          PY
      - name: Build SyncMe ARM64 with pristine Element X build flags
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=false -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - name: Verify actual ARM64 APK compression methods
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,glob,os
          files=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert files, "ARM64 APK missing"
          for f in files:
              with zipfile.ZipFile(f) as z:
                  natives=[i for i in z.infolist() if i.filename.endswith(".so")]
                  assert natives, "No native libraries in APK"
                  compressed=[i.filename for i in natives if i.compress_type!=zipfile.ZIP_STORED]
                  print(f, "APK bytes:", os.path.getsize(f), "Native libs:",len(natives),"Compressed native libs:",len(compressed))
                  assert not compressed, "Native libraries still compressed"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SyncMe-ARM64-parity-no-opt
          path: app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
          if-no-files-found: error
