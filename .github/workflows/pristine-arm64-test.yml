name: Element X pristine ARM64 no optimization test
on:
  push:
    branches:
      - baseline-elementx-arm64-no-opt-20261010
    paths:
      - '.github/workflows/pristine-arm64-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disable all app release optimization in temporary runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          data = p.read_text()
          old = "optimization {\n                enable = true"
          assert data.count(old) == 1, "Release optimization pattern changed"
          data = data.replace(old, "optimization {\n                enable = false")
          p.write_text(data)
          PY
          git diff -- app/build.gradle.kts
      - name: Build original Element X ARM64 without native compression or R8
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=false -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - name: Verify actual ARM64 APK compression methods
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,glob,os
          files=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert files, "ARM64 APK missing"
          for f in files:
              with zipfile.ZipFile(f) as z:
                  natives=[i for i in z.infolist() if i.filename.endswith(".so")]
                  assert natives, "No native libraries in APK"
                  compressed=[i.filename for i in natives if i.compress_type!=zipfile.ZIP_STORED]
                  print(f, "APK bytes:", os.path.getsize(f), "Native libs:",len(natives),"Compressed native libs:",len(compressed))
                  assert not compressed, "Native libraries still compressed"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Original-ElementX-ARM64-no-opt
          path: app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
          if-no-files-found: error
