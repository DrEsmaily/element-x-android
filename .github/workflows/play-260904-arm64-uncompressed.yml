name: Element X Play 26.09.4 ARM64 no optimization
on:
  push:
    branches:
      - baseline-play-260904-arm64-no-opt-20261010
    paths:
      - '.github/workflows/play-260904-arm64-uncompressed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Disable release optimization in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          old="optimization {\n                enable = true"
          assert s.count(old)==1, "Unexpected build configuration"
          p.write_text(s.replace(old,"optimization {\n                enable = false"))
          PY
      - name: Build Play variant ARM64 without R8 and native compression
        run: ./gradlew :app:assembleGplayRelease -PuseLegacyPackaging=false -x lintVitalGplayRelease --stacktrace --no-configuration-cache
      - name: Verify native libraries and APK
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,glob,os
          files=glob.glob("app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk")
          assert files,"ARM64 APK missing"
          for f in files:
              with zipfile.ZipFile(f) as z:
                  natives=[i for i in z.infolist() if i.filename.endswith(".so")]
                  assert natives,"Missing native libraries"
                  bad=[i.filename for i in natives if i.compress_type!=zipfile.ZIP_STORED]
                  print(f,"Bytes:",os.path.getsize(f),"Native:",len(natives),"Compressed:",len(bad))
                  assert not bad,"Native compression still enabled"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Play-26.09.4-ARM64-no-opt
          path: app/build/outputs/apk/gplay/release/*arm64-v8a*release.apk
          if-no-files-found: error
